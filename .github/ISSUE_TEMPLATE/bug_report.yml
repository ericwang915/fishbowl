name: Bug report
description: Something doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `fishbowl doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: audit
    attributes:
      label: Relevant `fishbowl logs` lines (check for anything private first)
      render: text
  - type: input
    id: env
    attributes:
      label: Mac model, macOS version, MCP client, decision model
      placeholder: "M2 Air, macOS 15.3, Claude Code, ollama/qwen3:8b"
