<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="fishbowl logo">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#79c0ff"/>
      <stop offset="1" stop-color="#1f6feb"/>
    </linearGradient>
    <clipPath id="bowl"><path d="M38 22h52v8c18 8 28 26 28 44 0 26-24 44-54 44S10 100 10 74c0-18 10-36 28-44z"/></clipPath>
  </defs>
  <!-- water -->
  <g clip-path="url(#bowl)">
    <rect x="0" y="52" width="128" height="80" fill="url(#water)"/>
    <path d="M0 54c12-6 20 6 32 0s20-6 32 0 20 6 32 0 20-6 32 0v6H0z" fill="#a5d6ff" opacity=".7"/>
    <!-- fish -->
    <g transform="translate(64 84)">
      <path d="M-22 0c8-12 26-12 34 0-8 12-26 12-34 0z" fill="#f78166"/>
      <path d="M12 0l14-10v20z" fill="#ffa198"/>
      <circle cx="-13" cy="-2" r="2.6" fill="#0d1117"/>
    </g>
    <circle cx="44" cy="70" r="3" fill="#cae8ff" opacity=".9"/>
    <circle cx="38" cy="62" r="2" fill="#cae8ff" opacity=".9"/>
    <!-- a cursor inside the bowl -->
    <path d="M86 92l0 18 5-5 4 8 4-2-4-8 7 0z" fill="#ffffff" stroke="#0d1117" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <!-- glass -->
  <path d="M38 22h52v8c18 8 28 26 28 44 0 26-24 44-54 44S10 100 10 74c0-18 10-36 28-44z" fill="none" stroke="#8b949e" stroke-width="4" stroke-linejoin="round"/>
  <rect x="34" y="16" width="60" height="8" rx="4" fill="#8b949e"/>
  <path d="M24 66c2-10 8-18 16-22" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".55"/>
</svg>
