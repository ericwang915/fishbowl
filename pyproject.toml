[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fishbowl-mcp"
version = "0.1.0"
description = "A watchable, local-first Linux computer for AI agents, living on your Mac. 25 MCP tools, live noVNC view, human takeover, audit log."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Eric Wang" }]
keywords = ["mcp", "computer-use", "browser-agent", "lima", "claude", "ollama", "virtual-machine", "novnc", "ai-agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "mcp>=1.2",
  "httpx>=0.27",
  "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pyyaml"]

[project.scripts]
fishbowl = "fishbowl.cli:main"

[project.urls]
Homepage = "https://github.com/ericwang915/fishbowl"
Documentation = "https://github.com/ericwang915/fishbowl/blob/main/docs/tools.md"
Changelog = "https://github.com/ericwang915/fishbowl/blob/main/CHANGELOG.md"
Issues = "https://github.com/ericwang915/fishbowl/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/fishbowl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E741: `l` for "line" is fine here; UP031: the JS templates use % on purpose.
ignore = ["E501", "E741", "UP031"]
